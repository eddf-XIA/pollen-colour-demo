[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pollen-colour-demo"
version = "0.1.0"
description = "Synthetic demonstration of dish segmentation and CIELAB colour-distribution export for pooled pollen photos"
readme = "README.md"
requires-python = ">=3.10"
# License: none chosen (all rights reserved; see README.md).
# Lower bounds are indicative; the tested versions are listed in README.md.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]
oracle = ["colour-science>=0.4"]   # optional independent cross-check in tests/test_colorimetry.py

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
